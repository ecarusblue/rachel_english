<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Rachel English 진도표</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f3d44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rachel English">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="fonts/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 로그인 화면 -->
  <section id="login-view" class="login" hidden>
    <div class="login-wrap">
      <div class="login-brand">
        <img class="login-mark" src="icons/logo-dark.svg" alt="">
        <h1>Rachel English</h1>
        <p>공부방 진도표</p>
      </div>
      <form id="login-form" class="card login-card" autocomplete="on">
        <h2>선생님 로그인</h2>
        <label>이메일
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <label class="check"><input type="checkbox" name="remember" id="remember-email"> 이메일 저장하기</label>
        <p id="login-err" class="error" role="alert"></p>
        <button class="btn primary" type="submit">로그인</button>
        <button class="btn ghost" type="button" id="btn-forgot">비밀번호를 잊으셨나요?</button>
      </form>
    </div>
  </section>

  <!-- 메인 앱 -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <strong><img class="brand-mark" src="icons/logo-dark.svg" alt=""><span>Rachel English<small class="muted brand-sub">진도표</small></span></strong>
        <button class="btn small ghost js-logout" type="button">로그아웃</button>
      </div>
      <button class="nav-btn" id="nav-overview">전체 현황</button>
      <button class="nav-btn nav-row" id="nav-makeup" type="button"><span>결석·보강</span><span class="nav-badge" id="nav-makeup-n" hidden>0</span></button>
      <button class="nav-btn" id="nav-evals">월말평가서</button>
      <button class="nav-btn" id="nav-recs">수업 추천</button>
      <div class="sidebar-title">
        <span>학생</span>
        <button class="btn small" id="btn-add-student">+ 추가</button>
      </div>
      <label class="check small-check">
        <input type="checkbox" id="show-inactive"> 퇴원/휴원 학생 보기
      </label>
      <ul id="student-list" class="student-list"></ul>
      <div class="sidebar-foot">
        <div class="foot-title">설정</div>
        <button class="foot-link" id="btn-textbooks" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>교재 관리</button>
        <button class="foot-link" id="btn-sched-edit" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>시간표 편집</button>
        <button class="foot-link" id="btn-kinds" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></svg>시험종류입력</button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button class="btn small menu-btn" type="button" id="btn-menu" aria-controls="sidebar" aria-expanded="false">메뉴</button>
        <button class="btn small side-btn" type="button" id="btn-side" aria-controls="sidebar" aria-expanded="true">◀ 메뉴 숨기기</button>
        <span class="muted user-line">로그인: <strong id="user-email"></strong></span>
        <span class="spacer"></span>
        <button class="btn small" type="button" id="btn-password">비밀번호 변경</button>
        <button class="btn small js-logout" type="button">로그아웃</button>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <!-- 공용 입력 다이얼로그 -->
  <dialog id="dlg">
    <form id="dlg-form" method="dialog" class="dlg-form">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <p id="dlg-err" class="error" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn danger" id="dlg-delete" hidden>삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="dlg-cancel">취소</button>
        <button type="submit" class="btn primary" id="dlg-submit">저장</button>
      </div>
    </form>
  </dialog>

  <div id="idle-warn" class="idle-warn" role="alertdialog" aria-live="assertive" hidden>
    <span><strong id="idle-left"></strong>초 후 사용이 없어 자동 로그아웃됩니다.</span>
    <button class="btn small primary" type="button" id="idle-stay">계속 사용</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
